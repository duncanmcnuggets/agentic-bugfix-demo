name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Controller tests
        run: python -m pytest tests -q
      - name: Target public tests
        run: python -m pytest demo_target/tests -q
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy bugfixer demo_target/src
      - name: Trusted acceptance
        run: >-
          python bugfixer/acceptance/check_bug001.py
          --target-src demo_target/src

